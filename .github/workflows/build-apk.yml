name: Build Cerdas AI APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36.1 build-tools;36.0.0'

      - name: Verify SDK Licenses and Packages
        run: |
          SDK_MGR="$(command -v sdkmanager || find /usr/local/lib/android/sdk "$ANDROID_HOME" "$ANDROID_SDK_ROOT" -name sdkmanager -type f 2>/dev/null | head -n 1)"
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "SDK_MGR=$SDK_MGR"
          yes | "$SDK_MGR" --licenses > /dev/null 2>&1 || true
          "$SDK_MGR" "platforms;android-36.1" "build-tools;36.0.0" "platform-tools"
          "$SDK_MGR" "build-tools;36.1.0" || true

      - name: Install Gradle 9.3.1
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-9.3.1-bin.zip -o /tmp/gradle.zip
          sudo mkdir -p /opt/gradle
          sudo unzip -q -o /tmp/gradle.zip -d /opt/gradle
          echo "/opt/gradle/gradle-9.3.1/bin" >> "$GITHUB_PATH"

      - name: Prepare Keystore and Environment
        run: |
          [ -f .env ] || cp .env.example .env || touch .env
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          rm -f /tmp/cerdas-upload-key.jks
          keytool -genkeypair -v -keystore /tmp/cerdas-upload-key.jks -storepass cerdasai123 -alias upload -keypass cerdasai123 -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Cerdas AI,O=Cerdas AI,C=ID"

      - name: Build Release APK
        env:
          KEYSTORE_PATH: /tmp/cerdas-upload-key.jks
          STORE_PASSWORD: cerdasai123
          KEY_PASSWORD: cerdasai123
        run: gradle assembleRelease --no-daemon --no-configuration-cache --stacktrace -Dorg.gradle.jvmargs="-Xmx3g -Dfile.encoding=UTF-8"

      - name: Upload Cerdas AI APK
        uses: actions/upload-artifact@v4
        with:
          name: Cerdas-AI-APK
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 30
